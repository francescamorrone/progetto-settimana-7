<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportsHub — Eventi sportivi</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <header class="site-header">

    <h1 class="fw-bold">SportsHub</h1>
    <p class="mb-4">Cerca una squadra, scopri prossime partite e ultimi risultati.</p>

    <div class="ricerca d-flex gap-2 mx-auto">
      <input type="text" id="cerca" class="form-control" placeholder="Cerca una squadra">
      
      <button type="button" id="bottone-cerca" class="btn btn-light fw-semibold">Cerca</button>
    </div>

  </header>

  <main class="container">

    <section id="risultati-section">

      <!--spinner-->
      <div id="spinner" class="text-center my-4" hidden>
        <div class="spinner-border text-primary"></div>
      </div>

      <!--ERRORE-->
      <div id="errore" class="alert alert-danger my-4" hidden></div>

      <!--SEZIONE SQUADRE TROVATE-->
      <div id="sezione-squadre" class="mt-4" hidden>

        <h2 class="titolo-sezione mb-3">Squadre trovate</h2>
        <div id="squadre" class="row g-3"> </div>

      </div>

    </section>

    <section id="dettagli-section" class="scheda-dettagli bg-white mt-4" hidden>

      <!--Nome della squadra-->
      <h3 id="nome-squadra" class="nome-squadra fw-bold mb-4"> </h3>

      <div class="row g-4">

        <div class="col-12 col-md-6">
          <h4 class="titolo-lista fw-bold">Prossimi eventi</h4>

          <ul id="prossimi" class="list-unstyled mb-0">

          </ul>
        </div>

        <div class="col-12 col-md-6">
          <h4 class="titolo-lista fw-bold">Ultimi risultati</h4>

          <ul id="risultati" class="list-unstyled mb-0">
            
          </ul>
        </div>

      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
    crossorigin="anonymous"></script>

  <script type="module" src="assets/js/main.js"></script>
</body>

</html>
