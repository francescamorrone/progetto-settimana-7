<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportsHub — Eventi sportivi</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-body-tertiary">

  <header class="bg-primary text-white py-4 px-3 mb-5 sticky-top shadow-sm d-flex flex-column align-items-center gap-2">

    <h1 class="display-5 fw-bold mb-0">SportsHub</h1>
    <p class="mb-3">Cerca una squadra, scopri prossime partite e ultimi risultati.</p>

    <div class="w-100 flex-grow-1" style="max-width: 550px;">

      <div class="d-flex gap-2 w-100">

        <input type="text" id="cerca" class="form-control flex-grow-1 w-100" placeholder="Cerca una squadra">

        <button type="button" id="bottone-cerca"
          class="btn btn-light text-primary fw-semibold px-3 px-md-4">Cerca</button>
      </div>

    </div>

    <div class="form-check form-switch mb-0 d-flex align-items-center gap-2">
      <input class="form-check-input" type="checkbox" role="switch" id="dark-mode">
    </div>

  </header>

  <main class="container py-4">

    <section id="preferite-section">

      <h2 class="fs-4 fw-bold mb-3"><i class="bi bi-star-fill text-warning me-2"></i>Le tue squadre preferite</h2>

      <div id="filtri" class="btn-group mb-3">
        <button type="button" class="btn btn-outline-primary active" data-sport="all">Tutti</button>
        <button type="button" class="btn btn-outline-primary" data-sport="Soccer">Calcio</button>
        <button type="button" class="btn btn-outline-primary" data-sport="Basketball">Basket</button>
        <button type="button" class="btn btn-outline-primary" data-sport="American Football">Football</button>
      </div>

      <div id="preferite" class="row g-3 preferite-lista"></div>

    </section>

    <section id="risultati-section">

      <div id="spinner" class="text-center my-4" hidden>
        <div class="spinner-border text-primary"></div>
      </div>

      <div id="errore" class="alert alert-danger my-4" hidden></div>

      <div id="sezione-squadre" class="mt-4" hidden>

        <h2 class="fs-4 fw-bold mb-3">Squadre trovate</h2>
        <div id="squadre" class="row g-3"></div>

      </div>

    </section>

    <section id="dettagli-section" class="bg-body rounded shadow-sm p-4 mt-4" hidden>

      <h3 id="nome-squadra" class="fs-4 fw-bold text-primary mb-4"></h3>

      <div class="row g-4">

        <div class="col-12 col-md-6">
          <h4 class="fs-5 fw-bold pb-3 mb-3 border-bottom border-2 border-primary">Prossimi eventi</h4>
          <ul id="prossimi" class="list-group list-group-flush"></ul>
        </div>

        <div class="col-12 col-md-6">
          <h4 class="fs-5 fw-bold pb-3 mb-3 border-bottom border-2 border-primary">Ultimi risultati</h4>
          <ul id="risultati" class="list-group list-group-flush"></ul>
        </div>

      </div>

    </section>

  </main>

  <footer class="site-footer bg-primary text-light p-5 mt-5">
    <div class="container">
      <p class="footer-copy text-center mb-0 fw-bold">© 2026 SportsHub — tutti i diritti riservati</p>
    </div>
  </footer>

  <div class="modal fade" id="evento-modal">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h2 class="modal-title fs-5 fw-bold">Dettagli evento</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <div class="card text-center">
            <div class="card-body">

              <img id="modal-lega-logo" class="object-fit-contain mb-3" width="80" height="80" alt="">
              <h3 class="fs-5 fw-bold mb-1" id="modal-campionato"></h3>
              <p class="text-secondary mb-3" id="modal-anno"></p>

              <div class="d-flex justify-content-around align-items-center mb-3">
                <div>
                  <div class="text-secondary small">Squadra in casa</div>
                  <div class="fw-semibold" id="modal-casa"></div>
                </div>
                <span class="fw-bold text-secondary">vs</span>
                <div>
                  <div class="text-secondary small">Squadra in trasferta</div>
                  <div class="fw-semibold" id="modal-trasferta"></div>
                </div>
              </div>

              <hr>

              <div class="d-flex justify-content-around">
                <div>
                  <i class="bi bi-calendar-event me-1"></i>
                  <span id="modal-data"></span>
                </div>
                <div>
                  <i class="bi bi-clock me-1"></i>
                  <span id="modal-ora"></span>
                </div>
              </div>

            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
    crossorigin="anonymous"></script>

  <script type="module" src="assets/js/main.js"></script>
</body>

</html>
